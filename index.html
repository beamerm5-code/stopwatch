<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GT 650 Exhaust Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #070b14 70%);
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px;
      padding: 22px 20px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .tabs {
      display: flex;
      background: #0b1120;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active {
      background: #ef4444;
      color: #ffffff;
    }
    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #cbd5e1;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Analog Dial + Smoke Canvas Container */
    .clock-wrap {
      position: relative;
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 14px;
    }
    .clock-wrap svg,
    .clock-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .clock-wrap svg {
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
    }
    .clock-wrap canvas {
      pointer-events: none;
      border-radius: 50%;
    }

    /* Subtle engine rumble on the silencer while running */
    #silencer-vib.running {
      animation: engineRumble 0.11s linear infinite;
    }
    @keyframes engineRumble {
      0% { transform: translate(0, 0); }
      25% { transform: translate(0.7px, -0.5px); }
      50% { transform: translate(-0.6px, 0.6px); }
      75% { transform: translate(0.5px, 0.4px); }
      100% { transform: translate(0, 0); }
    }

    /* Timer Set Inputs */
    .timer-inputs {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .timer-inputs.show {
      display: flex;
    }
    .time-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 6px 10px;
    }
    .time-field input {
      width: 48px;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .time-field span {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .digital {
      font-size: clamp(2rem, 9vw, 2.6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 12px 10px;
      margin-bottom: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .controls.two-col {
      grid-template-columns: repeat(2, 1fr);
    }
    .controls button {
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .controls button:active { transform: scale(0.95); }
    .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #22c55e; color: #052e16; }
    #startBtn.running { background: #f59e0b; color: #451a03; }
    #lapBtn { background: #3b82f6; color: #eff6ff; }
    #resetBtn { background: #ef4444; color: #fef2f2; }
    .laps {
      list-style: none;
      max-height: 160px;
      overflow-y: auto;
      text-align: left;
    }
    .laps li {
      display: flex;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid #1e293b;
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }
    .laps li span:first-child { color: #94a3b8; }
    .laps li .split { color: #38bdf8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="top-bar">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="timerTab">Timer</button>
        <button type="button" class="tab-btn" id="stopwatchTab">Stopwatch</button>
      </div>
      <span class="badge">GT 650</span>
    </div>

    <div class="clock-wrap">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-label="GT 650 Silencer Analog Timer">
        <defs>
          <!-- Chrome bezel gradient -->
          <linearGradient id="bezelChrome" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f1f5f9" />
            <stop offset="35%" stop-color="#64748b" />
            <stop offset="70%" stop-color="#e2e8f0" />
            <stop offset="100%" stop-color="#334155" />
          </linearGradient>

          <!-- Dial face gradient -->
          <radialGradient id="dialBg" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#090d16" />
          </radialGradient>

          <!-- Polished GT 650 chrome megaphone gradient -->
          <linearGradient id="chromePipe" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#cbd5e1" />
            <stop offset="18%" stop-color="#ffffff" />
            <stop offset="38%" stop-color="#94a3b8" />
            <stop offset="65%" stop-color="#334155" />
            <stop offset="85%" stop-color="#cbd5e1" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>

          <!-- Slightly darker brushed header bend -->
          <linearGradient id="headerPipe" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e2e8f0" />
            <stop offset="35%" stop-color="#94a3b8" />
            <stop offset="75%" stop-color="#334155" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>

          <!-- Exhaust heat flash inside tip -->
          <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fb923c" stop-opacity="0.95" />
            <stop offset="60%" stop-color="#ef4444" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Outer Chrome Bezel & Dark Tachometer Face -->
        <circle cx="150" cy="150" r="145" fill="url(#bezelChrome)" />
        <circle cx="150" cy="150" r="137" fill="url(#dialBg)" stroke="#0f172a" stroke-width="2" />

        <!-- Subtle Redline Arc (50 to 60 seconds) -->
        <path
          d="M 85.4 61.1 A 110 110 0 0 1 150 40"
          fill="none"
          stroke="#ef4444"
          stroke-width="3.5"
          stroke-linecap="round"
          opacity="0.65"
        />

        <!-- Dial Ticks & Numbers -->
        <g id="dial-marks"></g>

        <!-- === CONTINENTAL GT 650 UPSWEPT CHROME SILENCER === -->
        <g id="silencer-vib">
          <g transform="translate(145, 186) rotate(-24)">
            <!-- Drop shadow on dial -->
            <ellipse cx="0" cy="22" rx="66" ry="9" fill="#020617" opacity="0.55" />

            <!-- Rear mounting bracket -->
            <path d="M -2 12 L 8 24 L 18 24 L 12 13 Z" fill="#1e293b" stroke="#64748b" stroke-width="1" />
            <circle cx="13" cy="21" r="2.2" fill="#cbd5e1" />

            <!-- Header Pipe entering megaphone -->
            <path
              d="M -78 13 Q -58 5 -38 5 L -38 -5 Q -58 -5 -78 3 Z"
              fill="url(#headerPipe)"
              stroke="#1e293b"
              stroke-width="1"
            />

            <!-- Exhaust Collar / Clamp -->
            <rect x="-42" y="-7.5" width="9" height="15" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1" />
            <circle cx="-37.5" cy="5.5" r="1.4" fill="#e2e8f0" />

            <!-- Main Upswept Chrome Megaphone Canister -->
            <path
              d="M -33 -7 L 45 -16.5 L 62 -12.5 L 62 12.5 L 45 16.5 L -33 7 Z"
              fill="url(#chromePipe)"
              stroke="#475569"
              stroke-width="1.2"
              stroke-linejoin="round"
            />

            <!-- Specular top chrome highlight -->
            <path
              d="M -29 -4.5 L 44 -12.5 L 58 -9.5"
              fill="none"
              stroke="#ffffff"
              stroke-width="2"
              stroke-linecap="round"
              opacity="0.75"
            />

            <!-- Weld Seam Ring near end cone -->
            <line x1="45" y1="-16.5" x2="45" y2="16.5" stroke="#475569" stroke-width="1.4" opacity="0.8" />

            <!-- Black Heat Shield Accent Strip -->
            <rect x="-24" y="-3" width="32" height="6" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="0.8" />

            <!-- Subtle GT 650 Stamping -->
            <text
              x="24"
              y="3.5"
              text-anchor="middle"
              fill="#0f172a"
              font-size="8.2"
              font-weight="800"
              letter-spacing="0.6"
              opacity="0.82"
            >GT 650</text>

            <!-- Exhaust Outlet Rim & Dark Baffle Opening -->
            <ellipse cx="62" cy="0" rx="4.5" ry="12.5" fill="#94a3b8" stroke="#334155" stroke-width="1.2" />
            <ellipse cx="62.6" cy="0" rx="2.9" ry="9.8" fill="#090d16" />
            <ellipse cx="62.2" cy="0" rx="1.6" ry="5.5" fill="#1e293b" />

            <!-- Subtle Heat Flash on Throttle Start -->
            <ellipse id="exhaust-flash" cx="63" cy="0" rx="6" ry="10" fill="url(#heatGlow)" opacity="0" />
          </g>
        </g>

        <!-- Tachometer Second Hand -->
        <g id="second-hand" transform="rotate(0 150 150)">
          <!-- Counterweight tail -->
          <line x1="150" y1="150" x2="150" y2="174" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
          <!-- Main red pointer -->
          <polygon points="147.8,150 150,36 152.2,150" fill="#ef4444" />
          <!-- Center chrome hub -->
          <circle cx="150" cy="150" r="8.5" fill="url(#bezelChrome)" stroke="#0f172a" stroke-width="1.5" />
          <circle cx="150" cy="150" r="3" fill="#0f172a" />
        </g>
      </svg>

      <!-- Live Exhaust Smoke Canvas -->
      <canvas id="smokeCanvas" width="300" height="300"></canvas>
    </div>

    <!-- Countdown Timer Inputs -->
    <div class="timer-inputs show" id="timerInputs">
      <label class="time-field">
        <input id="minInput" type="number" min="0" max="99" value="1" />
        <span>min</span>
      </label>
      <label class="time-field">
        <input id="secInput" type="number" min="0" max="59" value="0" />
        <span>sec</span>
      </label>
    </div>

    <div class="digital" id="display">01:00.00</div>

    <div class="controls two-col" id="controls">
      <button type="button" id="startBtn">Start</button>
      <button type="button" id="lapBtn" style="display:none;" disabled>Lap</button>
      <button type="button" id="resetBtn" disabled>Reset</button>
    </div>

    <ul class="laps" id="laps"></ul>
  </main>

  <script>
    (() => {
      const dialMarks = document.getElementById("dial-marks");
      const secondHand = document.getElementById("second-hand");
      const silencerVib = document.getElementById("silencer-vib");
      const exhaustFlash = document.getElementById("exhaust-flash");
      const smokeCanvas = document.getElementById("smokeCanvas");
      const ctx = smokeCanvas.getContext("2d");

      const timerTab = document.getElementById("timerTab");
      const stopwatchTab = document.getElementById("stopwatchTab");
      const timerInputs = document.getElementById("timerInputs");
      const minInput = document.getElementById("minInput");
      const secInput = document.getElementById("secInput");
      const display = document.getElementById("display");
      const controls = document.getElementById("controls");
      const startBtn = document.getElementById("startBtn");
      const lapBtn = document.getElementById("lapBtn");
      const resetBtn = document.getElementById("resetBtn");
      const lapsList = document.getElementById("laps");

      // Build 60 tachometer dial ticks and numbers
      const svgNS = "http://www.w3.org/2000/svg";
      for (let i = 0; i < 60; i++) {
        const isMajor = i % 5 === 0;
        const angleRad = ((i * 6) - 90) * (Math.PI / 180);
        const rOuter = 132;
        const rInner = isMajor ? 119 : 125;

        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", (150 + rInner * Math.cos(angleRad)).toFixed(2));
        line.setAttribute("y1", (150 + rInner * Math.sin(angleRad)).toFixed(2));
        line.setAttribute("x2", (150 + rOuter * Math.cos(angleRad)).toFixed(2));
        line.setAttribute("y2", (150 + rOuter * Math.sin(angleRad)).toFixed(2));
        line.setAttribute("stroke", i >= 50 || i === 0 ? "#ef4444" : (isMajor ? "#f8fafc" : "#475569"));
        line.setAttribute("stroke-width", isMajor ? "2.6" : "1.3");
        line.setAttribute("stroke-linecap", "round");
        dialMarks.appendChild(line);

        if (isMajor) {
          const rText = 104;
          const text = document.createElementNS(svgNS, "text");
          text.setAttribute("x", (150 + rText * Math.cos(angleRad)).toFixed(2));
          text.setAttribute("y", (150 + rText * Math.sin(angleRad) + 4.5).toFixed(2));
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("fill", i === 0 ? "#ef4444" : "#cbd5e1");
          text.setAttribute("font-size", "12");
          text.setAttribute("font-weight", "700");
          text.textContent = i === 0 ? "60" : String(i);
          dialMarks.appendChild(text);
        }
      }

      // === EXHAUST SMOKE PARTICLE ENGINE ===
      // Exact mouth of the GT 650 silencer in 300x300 viewBox
      const MOUTH_X = 204;
      const MOUTH_Y = 160;
      const EXIT_ANGLE = -24 * (Math.PI / 180);
      const puffs = [];
      let lastSmokeSpawn = 0;

      function spawnPuff(boost = false) {
        const spread = (Math.random() - 0.5) * 0.36;
        const angle = EXIT_ANGLE + spread;
        const speed = (boost ? 2.4 : 1.5) + Math.random() * 1.1;
        puffs.push({
          x: MOUTH_X + (Math.random() - 0.5) * 3,
          y: MOUTH_Y + (Math.random() - 0.5) * 4,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: (boost ? 6.5 : 4.5) + Math.random() * 3,
          grow: 0.24 + Math.random() * 0.16,
          alpha: (boost ? 0.52 : 0.38) + Math.random() * 0.12,
          decay: 0.0055 + Math.random() * 0.0035,
          wobblePhase: Math.random() * Math.PI * 2
        });
      }

      function triggerRevBurst() {
        for (let i = 0; i < 9; i++) spawnPuff(true);
        exhaustFlash.setAttribute("opacity", "0.95");
        setTimeout(() => exhaustFlash.setAttribute("opacity", "0"), 130);
      }

      function drawSmoke(now) {
        ctx.clearRect(0, 0, 300, 300);

        if (running && now - lastSmokeSpawn > 48) {
          spawnPuff(false);
          if (Math.random() > 0.55) spawnPuff(false);
          lastSmokeSpawn = now;
        }

        // Keep smoke neatly inside the inner glass bezel
        ctx.save();
        ctx.beginPath();
        ctx.arc(150, 150, 134, 0, Math.PI * 2);
        ctx.clip();

        for (let i = puffs.length - 1; i >= 0; i--) {
          const p = puffs[i];
          p.wobblePhase += 0.07;
          p.x += p.vx + Math.sin(p.wobblePhase) * 0.22;
          p.y += p.vy;
          p.vx *= 0.982;
          p.vy = p.vy * 0.985 - 0.022; // hot smoke rises gently
          p.r += p.grow;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            puffs.splice(i, 1);
            continue;
          }

          const grad = ctx.createRadialGradient(p.x, p.y, p.r * 0.1, p.x, p.y, p.r);
          grad.addColorStop(0, `rgba(226, 232, 240, ${p.alpha.toFixed(3)})`);
          grad.addColorStop(0.55, `rgba(148, 163, 184, ${(p.alpha * 0.55).toFixed(3)})`);
          grad.addColorStop(1, "rgba(148, 163, 184, 0)");

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // === TIMER & STOPWATCH LOGIC ===
      let mode = "timer"; // "timer" or "stopwatch"
      let running = false;
      let startTime = 0;
      let elapsedTime = 0;
      let timerTotalMs = 60000;
      let timerRemainingMs = 60000;
      let lastLapTime = 0;
      let lapCount = 0;
      let audioCtx = null;

      function playFinishBeep() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          [0, 0.22, 0.44].forEach((offset) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + offset + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + offset);
            osc.stop(audioCtx.currentTime + offset + 0.19);
          });
        } catch {}
      }

      function formatTime(ms) {
        const clamped = Math.max(0, ms);
        const hours = Math.floor(clamped / 3600000);
        const minutes = Math.floor((clamped % 3600000) / 60000);
        const seconds = Math.floor((clamped % 60000) / 1000);
        const centis = Math.floor((clamped % 1000) / 10);
        const pad = (n) => String(n).padStart(2, "0");
        return hours > 0
          ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(centis)}`
          : `${pad(minutes)}:${pad(seconds)}.${pad(centis)}`;
      }

      function updateNeedle(ms) {
        const secondsInMinute = (Math.max(0, ms) % 60000) / 1000;
        const angle = secondsInMinute * 6;
        secondHand.setAttribute("transform", `rotate(${angle} 150 150)`);
      }

      function readTimerInputs() {
        const mins = Math.max(0, Math.min(99, parseInt(minInput.value, 10) || 0));
        const secs = Math.max(0, Math.min(59, parseInt(secInput.value, 10) || 0));
        timerTotalMs = (mins * 60 + secs) * 1000;
        timerRemainingMs = timerTotalMs;
        display.textContent = formatTime(timerRemainingMs);
        updateNeedle(timerRemainingMs);
      }

      function setMode(nextMode) {
        mode = nextMode;
        running = false;
        silencerVib.classList.remove("running");
        startBtn.textContent = "Start";
        startBtn.classList.remove("running");

        timerTab.classList.toggle("active", mode === "timer");
        stopwatchTab.classList.toggle("active", mode === "stopwatch");

        if (mode === "timer") {
          timerInputs.classList.add("show");
          controls.classList.add("two-col");
          lapBtn.style.display = "none";
          lapsList.innerHTML = "";
          readTimerInputs();
          resetBtn.disabled = true;
        } else {
          timerInputs.classList.remove("show");
          controls.classList.remove("two-col");
          lapBtn.style.display = "block";
          lapBtn.disabled = true;
          elapsedTime = 0;
          lastLapTime = 0;
          lapCount = 0;
          lapsList.innerHTML = "";
          display.textContent = "00:00.00";
          updateNeedle(0);
          resetBtn.disabled = true;
        }
      }

      timerTab.addEventListener("click", () => setMode("timer"));
      stopwatchTab.addEventListener("click", () => setMode("stopwatch"));

      minInput.addEventListener("input", () => { if (!running && mode === "timer") readTimerInputs(); });
      secInput.addEventListener("input", () => { if (!running && mode === "timer") readTimerInputs(); });

      startBtn.addEventListener("click", () => {
        // Unlock audio context on iOS Safari
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
        } catch {}

        if (!running) {
          if (mode === "timer") {
            if (timerRemainingMs <= 0) readTimerInputs();
            if (timerRemainingMs <= 0) return;
            startTime = Date.now() - (timerTotalMs - timerRemainingMs);
          } else {
            startTime = Date.now() - elapsedTime;
            lapBtn.disabled = false;
          }
          running = true;
          silencerVib.classList.add("running");
          triggerRevBurst();
          startBtn.textContent = "Pause";
          startBtn.classList.add("running");
          resetBtn.disabled = false;
        } else {
          running = false;
          silencerVib.classList.remove("running");
          startBtn.textContent = "Resume";
          startBtn.classList.remove("running");
          lapBtn.disabled = true;
        }
      });

      lapBtn.addEventListener("click", () => {
        if (!running || mode !== "stopwatch") return;
        lapCount += 1;
        const split = elapsedTime - lastLapTime;
        lastLapTime = elapsedTime;
        const li = document.createElement("li");
        li.innerHTML = `
          <span>Lap ${lapCount}</span>
          <span class="split">+${formatTime(split)}</span>
          <span>${formatTime(elapsedTime)}</span>
        `;
        lapsList.prepend(li);
      });

      resetBtn.addEventListener("click", () => {
        running = false;
        silencerVib.classList.remove("running");
        startBtn.textContent = "Start";
        startBtn.classList.remove("running");
        resetBtn.disabled = true;
        lapBtn.disabled = true;

        if (mode === "timer") {
          readTimerInputs();
        } else {
          elapsedTime = 0;
          lastLapTime = 0;
          lapCount = 0;
          lapsList.innerHTML = "";
          display.textContent = "00:00.00";
          updateNeedle(0);
        }
      });

      function tick(now) {
        if (running) {
          if (mode === "timer") {
            const passed = Date.now() - startTime;
            timerRemainingMs = Math.max(0, timerTotalMs - passed);
            display.textContent = formatTime(timerRemainingMs);
            updateNeedle(timerRemainingMs);

            if (timerRemainingMs <= 0) {
              running = false;
              silencerVib.classList.remove("running");
              startBtn.textContent = "Start";
              startBtn.classList.remove("running");
              triggerRevBurst();
              playFinishBeep();
            }
          } else {
            elapsedTime = Date.now() - startTime;
            display.textContent = formatTime(elapsedTime);
            updateNeedle(elapsedTime);
          }
        }

        drawSmoke(now);
        requestAnimationFrame(tick);
      }

      readTimerInputs();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
