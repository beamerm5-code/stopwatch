<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GT 650 Exhaust Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #070b14 70%);
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px;
      padding: 22px 20px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tabs {
      display: flex;
      background: #0b1120;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active {
      background: #ef4444;
      color: #ffffff;
    }
    .sound-btn {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #1e293b;
      color: #f8fafc;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .sound-btn.muted {
      background: #0b1120;
      color: #64748b;
    }

    /* Hold-to-rev dial area (prevents iPad long-press menu & scrolling) */
    .clock-wrap {
      position: relative;
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 10px;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.14s ease;
    }
    .clock-wrap.revving {
      transform: scale(0.985);
    }
    .clock-wrap svg,
    .clock-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    .clock-wrap svg {
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
    }
    .clock-wrap canvas {
      border-radius: 50%;
    }
    .rev-hint {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 12px;
      transition: color 0.15s ease;
    }
    .rev-hint.active {
      color: #fb923c;
      font-weight: 600;
    }

    /* Idle vibration vs intense hold-to-rev vibration */
    #silencer-vib.running {
      animation: engineRumble 0.11s linear infinite;
    }
    #silencer-vib.revving {
      animation: revShake 0.055s linear infinite;
    }
    @keyframes engineRumble {
      0% { transform: translate(0, 0); }
      25% { transform: translate(0.7px, -0.5px); }
      50% { transform: translate(-0.6px, 0.6px); }
      75% { transform: translate(0.5px, 0.4px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes revShake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(1.8px, -1.4px); }
      50% { transform: translate(-1.6px, 1.5px); }
      75% { transform: translate(1.4px, 1.2px); }
      100% { transform: translate(-1.2px, -1px); }
    }

    .timer-inputs {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .timer-inputs.show {
      display: flex;
    }
    .time-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 6px 10px;
    }
    .time-field input {
      width: 48px;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .time-field span {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .digital {
      font-size: clamp(2rem, 9vw, 2.6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 12px 10px;
      margin-bottom: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .controls.two-col {
      grid-template-columns: repeat(2, 1fr);
    }
    .controls button {
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .controls button:active { transform: scale(0.95); }
    .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #22c55e; color: #052e16; }
    #startBtn.running { background: #f59e0b; color: #451a03; }
    #lapBtn { background: #3b82f6; color: #eff6ff; }
    #resetBtn { background: #ef4444; color: #fef2f2; }
    .laps {
      list-style: none;
      max-height: 160px;
      overflow-y: auto;
      text-align: left;
    }
    .laps li {
      display: flex;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid #1e293b;
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }
    .laps li span:first-child { color: #94a3b8; }
    .laps li .split { color: #38bdf8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="top-bar">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="timerTab">Timer</button>
        <button type="button" class="tab-btn" id="stopwatchTab">Stopwatch</button>
      </div>
      <button type="button" class="sound-btn" id="soundBtn">🔊 Sound: On</button>
    </div>

    <div class="clock-wrap" id="clockWrap" aria-label="Press and hold to rev the GT 650 exhaust">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bezelChrome" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f1f5f9" />
            <stop offset="35%" stop-color="#64748b" />
            <stop offset="70%" stop-color="#e2e8f0" />
            <stop offset="100%" stop-color="#334155" />
          </linearGradient>
          <radialGradient id="dialBg" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#090d16" />
          </radialGradient>
          <linearGradient id="chromePipe" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#cbd5e1" />
            <stop offset="18%" stop-color="#ffffff" />
            <stop offset="38%" stop-color="#94a3b8" />
            <stop offset="65%" stop-color="#334155" />
            <stop offset="85%" stop-color="#cbd5e1" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>
          <linearGradient id="headerPipe" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e2e8f0" />
            <stop offset="35%" stop-color="#94a3b8" />
            <stop offset="75%" stop-color="#334155" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>
          <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fde047" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#fb923c" stop-opacity="0.85" />
            <stop offset="80%" stop-color="#ef4444" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
          </radialGradient>
        </defs>

        <circle cx="150" cy="150" r="145" fill="url(#bezelChrome)" />
        <circle cx="150" cy="150" r="137" fill="url(#dialBg)" stroke="#0f172a" stroke-width="2" />
        <path
          d="M 85.4 61.1 A 110 110 0 0 1 150 40"
          fill="none"
          stroke="#ef4444"
          stroke-width="3.5"
          stroke-linecap="round"
          opacity="0.65"
        />
        <g id="dial-marks"></g>

        <g id="silencer-vib">
          <g transform="translate(145, 186) rotate(-24)">
            <ellipse cx="0" cy="22" rx="66" ry="9" fill="#020617" opacity="0.55" />
            <path d="M -2 12 L 8 24 L 18 24 L 12 13 Z" fill="#1e293b" stroke="#64748b" stroke-width="1" />
            <circle cx="13" cy="21" r="2.2" fill="#cbd5e1" />
            <path
              d="M -78 13 Q -58 5 -38 5 L -38 -5 Q -58 -5 -78 3 Z"
              fill="url(#headerPipe)"
              stroke="#1e293b"
              stroke-width="1"
            />
            <rect x="-42" y="-7.5" width="9" height="15" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1" />
            <circle cx="-37.5" cy="5.5" r="1.4" fill="#e2e8f0" />
            <path
              d="M -33 -7 L 45 -16.5 L 62 -12.5 L 62 12.5 L 45 16.5 L -33 7 Z"
              fill="url(#chromePipe)"
              stroke="#475569"
              stroke-width="1.2"
              stroke-linejoin="round"
            />
            <path
              d="M -29 -4.5 L 44 -12.5 L 58 -9.5"
              fill="none"
              stroke="#ffffff"
              stroke-width="2"
              stroke-linecap="round"
              opacity="0.75"
            />
            <line x1="45" y1="-16.5" x2="45" y2="16.5" stroke="#475569" stroke-width="1.4" opacity="0.8" />
            <rect x="-24" y="-3" width="32" height="6" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="0.8" />
            <text
              x="24"
              y="3.5"
              text-anchor="middle"
              fill="#0f172a"
              font-size="8.2"
              font-weight="800"
              letter-spacing="0.6"
              opacity="0.82"
            >GT 650</text>
            <ellipse cx="62" cy="0" rx="4.5" ry="12.5" fill="#94a3b8" stroke="#334155" stroke-width="1.2" />
            <ellipse cx="62.6" cy="0" rx="2.9" ry="9.8" fill="#090d16" />
            <ellipse cx="62.2" cy="0" rx="1.6" ry="5.5" fill="#1e293b" />
            <ellipse id="exhaust-flash" cx="64" cy="0" rx="8" ry="11" fill="url(#heatGlow)" opacity="0" />
          </g>
        </g>

        <g id="second-hand" transform="rotate(0 150 150)">
          <line x1="150" y1="150" x2="150" y2="174" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
          <polygon points="147.8,150 150,36 152.2,150" fill="#ef4444" />
          <circle cx="150" cy="150" r="8.5" fill="url(#bezelChrome)" stroke="#0f172a" stroke-width="1.5" />
          <circle cx="150" cy="150" r="3" fill="#0f172a" />
        </g>
      </svg>

      <canvas id="smokeCanvas" width="300" height="300"></canvas>
    </div>

    <div class="rev-hint" id="revHint">Press and hold the silencer to rev</div>

    <div class="timer-inputs show" id="timerInputs">
      <label class="time-field">
        <input id="minInput" type="number" min="0" max="99" value="1" />
        <span>min</span>
      </label>
      <label class="time-field">
        <input id="secInput" type="number" min="0" max="59" value="0" />
        <span>sec</span>
      </label>
    </div>

    <div class="digital" id="display">01:00.00</div>

    <div class="controls two-col" id="controls">
      <button type="button" id="startBtn">Start</button>
      <button type="button" id="lapBtn" style="display:none;" disabled>Lap</button>
      <button type="button" id="resetBtn" disabled>Reset</button>
    </div>

    <ul class="laps" id="laps"></ul>
  </main>

  <script>
    (() => {
      const dialMarks = document.getElementById("dial-marks");
      const secondHand = document.getElementById("second-hand");
      const silencerVib = document.getElementById("silencer-vib");
      const exhaustFlash = document.getElementById("exhaust-flash");
      const clockWrap = document.getElementById("clockWrap");
      const revHint = document.getElementById("revHint");
      const smokeCanvas = document.getElementById("smokeCanvas");
      const ctx = smokeCanvas.getContext("2d");

      const timerTab = document.getElementById("timerTab");
      const stopwatchTab = document.getElementById("stopwatchTab");
      const soundBtn = document.getElementById("soundBtn");
      const timerInputs = document.getElementById("timerInputs");
      const minInput = document.getElementById("minInput");
      const secInput = document.getElementById("secInput");
      const display = document.getElementById("display");
      const controls = document.getElementById("controls");
      const startBtn = document.getElementById("startBtn");
      const lapBtn = document.getElementById("lapBtn");
      const resetBtn = document.getElementById("resetBtn");
      const lapsList = document.getElementById("laps");

      // Build 60 tachometer dial ticks and numbers
      const svgNS = "http://www.w3.org/2000/svg";
      for (let i = 0; i < 60; i++) {
        const isMajor = i % 5 === 0;
        const angleRad = ((i * 6) - 90) * (Math.PI / 180);
        const rOuter = 132;
        const rInner = isMajor ? 119 : 125;

        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", (150 + rInner * Math.cos(angleRad)).toFixed(2));
        line.setAttribute("y1", (150 + rInner * Math.sin(angleRad)).toFixed(2));
        line.setAttribute("x2", (150 + rOuter * Math.cos(angleRad)).toFixed(2));
        line.setAttribute("y2", (150 + rOuter * Math.sin(angleRad)).toFixed(2));
        line.setAttribute("stroke", i >= 50 || i === 0 ? "#ef4444" : (isMajor ? "#f8fafc" : "#475569"));
        line.setAttribute("stroke-width", isMajor ? "2.6" : "1.3");
        line.setAttribute("stroke-linecap", "round");
        dialMarks.appendChild(line);

        if (isMajor) {
          const rText = 104;
          const text = document.createElementNS(svgNS, "text");
          text.setAttribute("x", (150 + rText * Math.cos(angleRad)).toFixed(2));
          text.setAttribute("y", (150 + rText * Math.sin(angleRad) + 4.5).toFixed(2));
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("fill", i === 0 ? "#ef4444" : "#cbd5e1");
          text.setAttribute("font-size", "12");
          text.setAttribute("font-weight", "700");
          text.textContent = i === 0 ? "60" : String(i);
          dialMarks.appendChild(text);
        }
      }

      // === UNIFIED GT 650 CONTINUOUS ENGINE + HOLD-TO-REV AUDIO ===
      let soundEnabled = true;
      let isRevving = false;
      let running = false;
      let audioCtx = null;
      let noiseBuffer = null;
      let engine = null;
      let stopTimer = null;

      function ensureAudio() {
        try {
          if (!audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioCtx();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
          if (!noiseBuffer && audioCtx) {
            const len = audioCtx.sampleRate * 2;
            noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
          }
          return audioCtx;
        } catch {
          return null;
        }
      }

      function createEngineGraph(ac) {
        const now = ac.currentTime;
        const master = ac.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.connect(ac.destination);

        const filter = ac.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(210, now);
        filter.Q.setValueAtTime(2.5, now);

        const pulseGain = ac.createGain();
        pulseGain.gain.setValueAtTime(0.68, now);

        const lfo = ac.createOscillator();
        lfo.type = "sine";
        lfo.frequency.setValueAtTime(10.5, now);
        const lfoDepth = ac.createGain();
        lfoDepth.gain.setValueAtTime(0.28, now);
        lfo.connect(lfoDepth);
        lfoDepth.connect(pulseGain.gain);

        const osc1 = ac.createOscillator();
        osc1.type = "sawtooth";
        osc1.frequency.setValueAtTime(52, now);

        const osc2 = ac.createOscillator();
        osc2.type = "triangle";
        osc2.frequency.setValueAtTime(104, now);
        const osc2Gain = ac.createGain();
        osc2Gain.gain.setValueAtTime(0.45, now);

        osc1.connect(filter);
        osc2.connect(osc2Gain);
        osc2Gain.connect(filter);
        filter.connect(pulseGain);
        pulseGain.connect(master);

        const noise = ac.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;
        const noiseFilter = ac.createBiquadFilter();
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.setValueAtTime(200, now);
        noiseFilter.Q.setValueAtTime(1.1, now);
        const noiseGain = ac.createGain();
        noiseGain.gain.setValueAtTime(0.22, now);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(pulseGain);

        osc1.start(now);
        osc2.start(now);
        lfo.start(now);
        noise.start(now);

        return { master, filter, osc1, osc2, lfo, noise, noiseFilter, noiseGain };
      }

      function ramp(param, target, timeConst, now) {
        param.cancelScheduledValues(now);
        param.setValueAtTime(param.value, now);
        param.setTargetAtTime(target, now, timeConst);
      }

      function destroyEngineGraph() {
        if (!engine) return;
        const old = engine;
        engine = null;
        try {
          old.osc1.stop();
          old.osc2.stop();
          old.lfo.stop();
          old.noise.stop();
          old.master.disconnect();
        } catch {}
      }

      // Seamlessly transitions between Off, Idle (timer running), and Full Rev (finger held)
      function syncEngineAudio() {
        if (stopTimer) {
          clearTimeout(stopTimer);
          stopTimer = null;
        }

        const wantAudio = soundEnabled && (running || isRevving);
        if (!wantAudio) {
          if (engine && audioCtx) {
            const now = audioCtx.currentTime;
            ramp(engine.osc1.frequency, 46, 0.14, now);
            ramp(engine.osc2.frequency, 92, 0.14, now);
            ramp(engine.lfo.frequency, 8.5, 0.14, now);
            ramp(engine.filter.frequency, 150, 0.14, now);
            ramp(engine.master.gain, 0.0001, 0.11, now);
            stopTimer = setTimeout(() => {
              if (!soundEnabled || (!running && !isRevving)) {
                destroyEngineGraph();
              }
            }, 460);
          }
          return;
        }

        const ac = ensureAudio();
        if (!ac) return;
        if (!engine) engine = createEngineGraph(ac);

        const now = ac.currentTime;
        if (isRevving) {
          // Climb to high RPM and stay roaring as long as finger is held
          ramp(engine.osc1.frequency, 142, 0.18, now);
          ramp(engine.osc2.frequency, 284, 0.18, now);
          ramp(engine.lfo.frequency, 26, 0.18, now);
          ramp(engine.filter.frequency, 920, 0.16, now);
          ramp(engine.noiseFilter.frequency, 480, 0.16, now);
          ramp(engine.noiseGain.gain, 0.36, 0.12, now);
          ramp(engine.master.gain, 0.46, 0.07, now);
        } else {
          // Settle down to steady GT 650 twin-cylinder idle rumble
          ramp(engine.osc1.frequency, 52, 0.16, now);
          ramp(engine.osc2.frequency, 104, 0.16, now);
          ramp(engine.lfo.frequency, 10.5, 0.16, now);
          ramp(engine.filter.frequency, 210, 0.16, now);
          ramp(engine.noiseFilter.frequency, 190, 0.16, now);
          ramp(engine.noiseGain.gain, 0.22, 0.14, now);
          ramp(engine.master.gain, 0.30, 0.12, now);
        }
      }

      function playFinishAlarm() {
        if (!soundEnabled) return;
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;
        [880, 1046.5, 1318.5].forEach((freq, idx) => {
          const start = now + idx * 0.2;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.28, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(start);
          osc.stop(start + 0.19);
        });
      }

      function syncSilencerVisuals() {
        silencerVib.classList.toggle("revving", isRevving);
        silencerVib.classList.toggle("running", running && !isRevving);
        clockWrap.classList.toggle("revving", isRevving);
        revHint.textContent = isRevving
          ? "Revving GT 650..."
          : "Press and hold the silencer to rev";
        revHint.classList.toggle("active", isRevving);
        if (!isRevving) {
          exhaustFlash.setAttribute("opacity", "0");
        }
      }

      soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "🔊 Sound: On" : "🔇 Sound: Off";
        soundBtn.classList.toggle("muted", !soundEnabled);
        if (soundEnabled) ensureAudio();
        syncEngineAudio();
      });

      // === EXHAUST SMOKE PARTICLE ENGINE ===
      const MOUTH_X = 204;
      const MOUTH_Y = 160;
      const EXIT_ANGLE = -24 * (Math.PI / 180);
      const puffs = [];
      let lastSmokeSpawn = 0;

      function spawnPuff(boost = false) {
        const spread = (Math.random() - 0.5) * (boost ? 0.44 : 0.34);
        const angle = EXIT_ANGLE + spread;
        const speed = (boost ? 2.7 : 1.5) + Math.random() * 1.2;
        puffs.push({
          x: MOUTH_X + (Math.random() - 0.5) * 3,
          y: MOUTH_Y + (Math.random() - 0.5) * 4,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: (boost ? 6.8 : 4.5) + Math.random() * 3.2,
          grow: (boost ? 0.30 : 0.24) + Math.random() * 0.16,
          alpha: (boost ? 0.54 : 0.38) + Math.random() * 0.12,
          decay: 0.0055 + Math.random() * 0.0035,
          wobblePhase: Math.random() * Math.PI * 2
        });
      }

      function startRev(e) {
        if (e) e.preventDefault();
        if (isRevving) return;
        isRevving = true;
        ensureAudio();
        syncSilencerVisuals();
        syncEngineAudio();
        for (let i = 0; i < 6; i++) spawnPuff(true);
      }

      function stopRev() {
        if (!isRevving) return;
        isRevving = false;
        syncSilencerVisuals();
        syncEngineAudio();
      }

      clockWrap.addEventListener("pointerdown", startRev);
      clockWrap.addEventListener("contextmenu", (e) => e.preventDefault());
      window.addEventListener("pointerup", stopRev);
      window.addEventListener("pointercancel", stopRev);
      window.addEventListener("blur", stopRev);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopRev();
      });

      function drawSmoke(now) {
        ctx.clearRect(0, 0, 300, 300);

        if (isRevving) {
          // Flicker exhaust heat glow and pump thick smoke while finger is held
          const glow = 0.55 + Math.random() * 0.4;
          exhaustFlash.setAttribute("opacity", glow.toFixed(2));
          if (now - lastSmokeSpawn > 24) {
            spawnPuff(true);
            spawnPuff(true);
            lastSmokeSpawn = now;
          }
        } else if (running && now - lastSmokeSpawn > 48) {
          spawnPuff(false);
          if (Math.random() > 0.55) spawnPuff(false);
          lastSmokeSpawn = now;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(150, 150, 134, 0, Math.PI * 2);
        ctx.clip();

        for (let i = puffs.length - 1; i >= 0; i--) {
          const p = puffs[i];
          p.wobblePhase += 0.07;
          p.x += p.vx + Math.sin(p.wobblePhase) * 0.22;
          p.y += p.vy;
          p.vx *= 0.982;
          p.vy = p.vy * 0.985 - 0.022;
          p.r += p.grow;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            puffs.splice(i, 1);
            continue;
          }

          const grad = ctx.createRadialGradient(p.x, p.y, p.r * 0.1, p.x, p.y, p.r);
          grad.addColorStop(0, `rgba(226, 232, 240, ${p.alpha.toFixed(3)})`);
          grad.addColorStop(0.55, `rgba(148, 163, 184, ${(p.alpha * 0.55).toFixed(3)})`);
          grad.addColorStop(1, "rgba(148, 163, 184, 0)");

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // === TIMER & STOPWATCH LOGIC ===
      let mode = "timer";
      let startTime = 0;
      let elapsedTime = 0;
      let timerTotalMs = 60000;
      let timerRemainingMs = 60000;
      let lastLapTime = 0;
      let lapCount = 0;

      function formatTime(ms) {
        const clamped = Math.max(0, ms);
        const hours = Math.floor(clamped / 3600000);
        const minutes = Math.floor((clamped % 3600000) / 60000);
        const seconds = Math.floor((clamped % 60000) / 1000);
        const centis = Math.floor((clamped % 1000) / 10);
        const pad = (n) => String(n).padStart(2, "0");
        return hours > 0
          ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(centis)}`
          : `${pad(minutes)}:${pad(seconds)}.${pad(centis)}`;
      }

      function updateNeedle(ms) {
        const secondsInMinute = (Math.max(0, ms) % 60000) / 1000;
        secondHand.setAttribute("transform", `rotate(${secondsInMinute * 6} 150 150)`);
      }

      function readTimerInputs() {
        const mins = Math.max(0, Math.min(99, parseInt(minInput.value, 10) || 0));
        const secs = Math.max(0, Math.min(59, parseInt(secInput.value, 10) || 0));
        timerTotalMs = (mins * 60 + secs) * 1000;
        timerRemainingMs = timerTotalMs;
        display.textContent = formatTime(timerRemainingMs);
        updateNeedle(timerRemainingMs);
      }

      function setMode(nextMode) {
        mode = nextMode;
        running = false;
        syncSilencerVisuals();
        syncEngineAudio();
        startBtn.textContent = "Start";
        startBtn.classList.remove("running");

        timerTab.classList.toggle("active", mode === "timer");
        stopwatchTab.classList.toggle("active", mode === "stopwatch");

        if (mode === "timer") {
          timerInputs.classList.add("show");
          controls.classList.add("two-col");
          lapBtn.style.display = "none";
          lapsList.innerHTML = "";
          readTimerInputs();
          resetBtn.disabled = true;
        } else {
          timerInputs.classList.remove("show");
          controls.classList.remove("two-col");
          lapBtn.style.display = "block";
          lapBtn.disabled = true;
          elapsedTime = 0;
          lastLapTime = 0;
          lapCount = 0;
          lapsList.innerHTML = "";
          display.textContent = "00:00.00";
          updateNeedle(0);
          resetBtn.disabled = true;
        }
      }

      timerTab.addEventListener("click", () => setMode("timer"));
      stopwatchTab.addEventListener("click", () => setMode("stopwatch"));

      minInput.addEventListener("input", () => { if (!running && mode === "timer") readTimerInputs(); });
      secInput.addEventListener("input", () => { if (!running && mode === "timer") readTimerInputs(); });

      startBtn.addEventListener("click", () => {
        ensureAudio();

        if (!running) {
          if (mode === "timer") {
            if (timerRemainingMs <= 0) readTimerInputs();
            if (timerRemainingMs <= 0) return;
            startTime = Date.now() - (timerTotalMs - timerRemainingMs);
          } else {
            startTime = Date.now() - elapsedTime;
            lapBtn.disabled = false;
          }
          running = true;
          syncSilencerVisuals();
          syncEngineAudio();
          for (let i = 0; i < 6; i++) spawnPuff(true);
          startBtn.textContent = "Pause";
          startBtn.classList.add("running");
          resetBtn.disabled = false;
        } else {
          running = false;
          syncSilencerVisuals();
          syncEngineAudio();
          startBtn.textContent = "Resume";
          startBtn.classList.remove("running");
          lapBtn.disabled = true;
        }
      });

      lapBtn.addEventListener("click", () => {
        if (!running || mode !== "stopwatch") return;
        for (let i = 0; i < 6; i++) spawnPuff(true);
        lapCount += 1;
        const split = elapsedTime - lastLapTime;
        lastLapTime = elapsedTime;
        const li = document.createElement("li");
        li.innerHTML = `
          <span>Lap ${lapCount}</span>
          <span class="split">+${formatTime(split)}</span>
          <span>${formatTime(elapsedTime)}</span>
        `;
        lapsList.prepend(li);
      });

      resetBtn.addEventListener("click", () => {
        running = false;
        syncSilencerVisuals();
        syncEngineAudio();
        startBtn.textContent = "Start";
        startBtn.classList.remove("running");
        resetBtn.disabled = true;
        lapBtn.disabled = true;

        if (mode === "timer") {
          readTimerInputs();
        } else {
          elapsedTime = 0;
          lastLapTime = 0;
          lapCount = 0;
          lapsList.innerHTML = "";
          display.textContent = "00:00.00";
          updateNeedle(0);
        }
      });

      function tick(now) {
        if (running) {
          if (mode === "timer") {
            const passed = Date.now() - startTime;
            timerRemainingMs = Math.max(0, timerTotalMs - passed);
            display.textContent = formatTime(timerRemainingMs);
            updateNeedle(timerRemainingMs);

            if (timerRemainingMs <= 0) {
              running = false;
              syncSilencerVisuals();
              syncEngineAudio();
              startBtn.textContent = "Start";
              startBtn.classList.remove("running");
              playFinishAlarm();
            }
          } else {
            elapsedTime = Date.now() - startTime;
            display.textContent = formatTime(elapsedTime);
            updateNeedle(elapsedTime);
          }
        }

        drawSmoke(now);
        requestAnimationFrame(tick);
      }

      readTimerInputs();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
