<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dog Tail Analog Stopwatch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border-radius: 26px;
      padding: 24px 20px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .mode-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .clock-wrap {
      width: 100%;
      max-width: 310px;
      margin: 0 auto 14px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.35));
    }
    .digital {
      font-size: clamp(2rem, 9vw, 2.6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      background: #0f172a;
      border-radius: 16px;
      padding: 12px 10px;
      margin-bottom: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .controls button {
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .controls button:active { transform: scale(0.96); }
    .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #22c55e; color: #052e16; }
    #startBtn.running { background: #f59e0b; color: #451a03; }
    #lapBtn { background: #3b82f6; color: #eff6ff; }
    #resetBtn { background: #ef4444; color: #fef2f2; }
    .laps {
      list-style: none;
      max-height: 170px;
      overflow-y: auto;
      text-align: left;
    }
    .laps li {
      display: flex;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid #334155;
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
    }
    .laps li span:first-child { color: #94a3b8; }
    .laps li .split { color: #38bdf8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <h1>Stopwatch</h1>
      <button id="modeBtn" class="mode-btn">Motion: Smooth</button>
    </div>

    <div class="clock-wrap">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-label="Analog dog stopwatch">
        <!-- Outer Bezel & Dial -->
        <circle cx="150" cy="150" r="144" fill="#334155" />
        <circle cx="150" cy="150" r="136" fill="#0f172a" stroke="#475569" stroke-width="2" />

        <!-- Tick Marks & Second Numbers (populated by JS) -->
        <g id="dial-marks"></g>

        <!-- === MOVING TAIL (ONLY this element rotates like a second hand) === -->
        <g id="dog-tail" transform="rotate(0 150 150)">
          <path
            d="M 143 150 C 141 118, 140 82, 146 52 C 147.5 43, 148.5 36, 150 32 C 151.5 36, 152.5 43, 154 52 C 160 82, 159 118, 157 150 Z"
            fill="#b45309"
            stroke="#78350f"
            stroke-width="1.5"
          />
          <!-- Light cream tip pointing directly at the seconds -->
          <path
            d="M 145.6 54 C 147.2 44, 148.5 36, 150 32 C 151.5 36, 152.8 44, 154.4 54 Q 150 59 145.6 54 Z"
            fill="#fef3c7"
          />
          <path
            d="M 148.5 142 Q 147.5 96 149.5 58"
            stroke="#d97706"
            stroke-width="2.5"
            stroke-linecap="round"
            fill="none"
            opacity="0.65"
          />
        </g>

        <!-- === COMPLETELY STILL DOG (zero movement) === -->
        <g id="still-dog">
          <!-- Shadow under paws -->
          <ellipse cx="150" cy="190" rx="34" ry="7" fill="#020617" opacity="0.55" />

          <!-- Sitting back hips -->
          <ellipse cx="131" cy="179" rx="12" ry="9" fill="#92400e" />
          <ellipse cx="169" cy="179" rx="12" ry="9" fill="#92400e" />

          <!-- Body -->
          <path d="M 131 146 Q 127 184 150 185 Q 173 184 169 146 Z" fill="#b45309" />

          <!-- Fluffy Chest -->
          <path d="M 140 148 Q 150 172 160 148 Q 163 166 150 174 Q 137 166 140 148 Z" fill="#f59e0b" />

          <!-- Front Legs & Paws -->
          <rect x="135" y="158" width="11" height="29" rx="5.5" fill="#d97706" />
          <ellipse cx="140.5" cy="187" rx="7.5" ry="4.5" fill="#fef3c7" />
          <rect x="154" y="158" width="11" height="29" rx="5.5" fill="#d97706" />
          <ellipse cx="159.5" cy="187" rx="7.5" ry="4.5" fill="#fef3c7" />

          <!-- Collar & Gold Tag -->
          <path d="M 134 147 Q 150 155 166 147" stroke="#ef4444" stroke-width="6" stroke-linecap="round" fill="none" />
          <circle cx="150" cy="155" r="4" fill="#fbbf24" stroke="#92400e" stroke-width="1" />

          <!-- Floppy Ears -->
          <path d="M 130 116 C 117 118 114 142 122 150 C 128 147 132 132 132 122 Z" fill="#78350f" />
          <path d="M 170 116 C 183 118 186 142 178 150 C 172 147 168 132 168 122 Z" fill="#78350f" />

          <!-- Head -->
          <circle cx="150" cy="128" r="22" fill="#d97706" />

          <!-- Snout -->
          <ellipse cx="150" cy="135" rx="11.5" ry="8.5" fill="#fef3c7" />

          <!-- Nose -->
          <ellipse cx="150" cy="131" rx="5" ry="3.6" fill="#0f172a" />
          <ellipse cx="148.8" cy="130" rx="1.4" ry="0.9" fill="#64748b" />

          <!-- Smile -->
          <path d="M 150 134.5 L 150 137.5" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" />
          <path d="M 145 137 Q 150 141.5 155 137" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" fill="none" />

          <!-- Eyes -->
          <circle cx="141" cy="123" r="3.4" fill="#0f172a" />
          <circle cx="140" cy="122" r="1.1" fill="#ffffff" />
          <circle cx="159" cy="123" r="3.4" fill="#0f172a" />
          <circle cx="158" cy="122" r="1.1" fill="#ffffff" />

          <!-- Eyebrows -->
          <path d="M 137 117 Q 141 115 144 117.5" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" fill="none" />
          <path d="M 156 117.5 Q 159 115 163 117" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" fill="none" />
        </g>
      </svg>
    </div>

    <div class="digital" id="display">00:00.00</div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="lapBtn" disabled>Lap</button>
      <button id="resetBtn" disabled>Reset</button>
    </div>

    <ul class="laps" id="laps"></ul>
  </main>

  <script>
    const dialMarks = document.getElementById("dial-marks");
    const dogTail = document.getElementById("dog-tail");
    const display = document.getElementById("display");
    const startBtn = document.getElementById("startBtn");
    const lapBtn = document.getElementById("lapBtn");
    const resetBtn = document.getElementById("resetBtn");
    const modeBtn = document.getElementById("modeBtn");
    const lapsList = document.getElementById("laps");

    // Build 60 tick marks and 12 numbers around the analog stopwatch dial
    const svgNS = "http://www.w3.org/2000/svg";
    for (let i = 0; i < 60; i++) {
      const isMajor = i % 5 === 0;
      const angleRad = ((i * 6) - 90) * (Math.PI / 180);
      const rOuter = 132;
      const rInner = isMajor ? 119 : 125;

      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", (150 + rInner * Math.cos(angleRad)).toFixed(2));
      line.setAttribute("y1", (150 + rInner * Math.sin(angleRad)).toFixed(2));
      line.setAttribute("x2", (150 + rOuter * Math.cos(angleRad)).toFixed(2));
      line.setAttribute("y2", (150 + rOuter * Math.sin(angleRad)).toFixed(2));
      line.setAttribute("stroke", isMajor ? "#f8fafc" : "#475569");
      line.setAttribute("stroke-width", isMajor ? "2.6" : "1.4");
      line.setAttribute("stroke-linecap", "round");
      dialMarks.appendChild(line);

      if (isMajor) {
        const rText = 104;
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", (150 + rText * Math.cos(angleRad)).toFixed(2));
        text.setAttribute("y", (150 + rText * Math.sin(angleRad) + 4.5).toFixed(2));
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", i === 0 ? "#fbbf24" : "#94a3b8");
        text.setAttribute("font-size", "12.5");
        text.setAttribute("font-weight", "700");
        text.textContent = i === 0 ? "60" : String(i);
        dialMarks.appendChild(text);
      }
    }

    let startTime = 0;
    let elapsedTime = 0;
    let lastLapTime = 0;
    let lapCount = 0;
    let running = false;
    let tickMode = false;
    let rafId = null;

    function formatTime(ms) {
      const hours = Math.floor(ms / 3600000);
      const minutes = Math.floor((ms % 3600000) / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const centis = Math.floor((ms % 1000) / 10);
      const pad = (n) => String(n).padStart(2, "0");
      return hours > 0
        ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(centis)}`
        : `${pad(minutes)}:${pad(seconds)}.${pad(centis)}`;
    }

    // Rotate ONLY the dog's tail around the center (150, 150)
    function updateTail(ms) {
      const secondsInMinute = (ms % 60000) / 1000;
      const angle = tickMode
        ? Math.floor(secondsInMinute) * 6
        : secondsInMinute * 6;
      dogTail.setAttribute("transform", `rotate(${angle} 150 150)`);
    }

    function update() {
      if (!running) return;
      elapsedTime = Date.now() - startTime;
      display.textContent = formatTime(elapsedTime);
      updateTail(elapsedTime);
      rafId = requestAnimationFrame(update);
    }

    startBtn.addEventListener("click", () => {
      if (!running) {
        startTime = Date.now() - elapsedTime;
        running = true;
        startBtn.textContent = "Pause";
        startBtn.classList.add("running");
        lapBtn.disabled = false;
        resetBtn.disabled = false;
        rafId = requestAnimationFrame(update);
      } else {
        running = false;
        cancelAnimationFrame(rafId);
        elapsedTime = Date.now() - startTime;
        display.textContent = formatTime(elapsedTime);
        updateTail(elapsedTime);
        startBtn.textContent = "Resume";
        startBtn.classList.remove("running");
        lapBtn.disabled = true;
      }
    });

    lapBtn.addEventListener("click", () => {
      if (!running) return;
      lapCount += 1;
      const split = elapsedTime - lastLapTime;
      lastLapTime = elapsedTime;

      const li = document.createElement("li");
      li.innerHTML = `
        <span>Lap ${lapCount}</span>
        <span class="split">+${formatTime(split)}</span>
        <span>${formatTime(elapsedTime)}</span>
      `;
      lapsList.prepend(li);
    });

    resetBtn.addEventListener("click", () => {
      running = false;
      cancelAnimationFrame(rafId);
      elapsedTime = 0;
      lastLapTime = 0;
      lapCount = 0;
      display.textContent = "00:00.00";
      updateTail(0);
      lapsList.innerHTML = "";
      startBtn.textContent = "Start";
      startBtn.classList.remove("running");
      lapBtn.disabled = true;
      resetBtn.disabled = true;
    });

    modeBtn.addEventListener("click", () => {
      tickMode = !tickMode;
      modeBtn.textContent = tickMode ? "Motion: 1s Tick" : "Motion: Smooth";
      updateTail(elapsedTime);
    });
  </script>
</body>
</html>
