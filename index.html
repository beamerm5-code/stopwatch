<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GT 650 Exhaust Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #070b14 70%);
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px;
      padding: 22px 20px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .tabs {
      display: flex;
      background: #0b1120;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active {
      background: #ef4444;
      color: #ffffff;
    }
    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #cbd5e1;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Analog Dial + Smoke Canvas Container */
    .clock-wrap {
      position: relative;
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 14px;
    }
    .clock-wrap svg,
    .clock-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .clock-wrap svg {
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
    }
    .clock-wrap canvas {
      pointer-events: none;
      border-radius: 50%;
    }

    /* Subtle engine rumble on the silencer while running */
    #silencer-vib.running {
      animation: engineRumble 0.11s linear infinite;
    }
    @keyframes engineRumble {
      0% { transform: translate(0, 0); }
      25% { transform: translate(0.7px, -0.5px); }
      50% { transform: translate(-0.6px, 0.6px); }
      75% { transform: translate(0.5px, 0.4px); }
      100% { transform: translate(0, 0); }
    }

    /* Timer Set Inputs */
    .timer-inputs {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .timer-inputs.show {
      display: flex;
    }
    .time-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 6px 10px;
    }
    .time-field input {
      width: 48px;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .time-field span {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .digital {
      font-size: clamp(2rem, 9vw, 2.6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.0
